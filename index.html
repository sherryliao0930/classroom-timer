<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>課堂計時器</title>
<style>
  /* 品學堂刊物色系：奶油紙底 × 印章紅 × 墨黑，明體為主 */
  :root{
    --paper:#F6F0E6; --paper2:#EFE7D8;
    --ink:#2B2622; --ink-soft:#6E6259;
    --red:#A61B22; --red-deep:#8A161C;
    --rule:#D6C9B4;
    --serif:"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU","MingLiU",serif;
    --numfont:"Cambria","Times New Roman","Noto Serif TC",serif;
    --dh: min(clamp(150px, 46vh, 470px), 23vw);   /* 時間是主角，盡量放大 */
  }
  html[data-theme="dark"]{
    --paper:#221E1A; --paper2:#2A241F;
    --ink:#F4EEE3; --ink-soft:#B3A899;
    --red:#D2434A; --red-deep:#B8323A;
    --rule:#4A4137;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; overflow:hidden; background:var(--paper); color:var(--ink);
    font-family:var(--serif); display:flex; flex-direction:column;
    transition:background .3s, color .3s;
  }

  /* ---------- 刊頭 ---------- */
  header{flex:0 0 auto; display:flex; align-items:center; gap:14px; padding:12px 22px 10px;
         border-bottom:1px solid var(--rule)}
  .stamp{width:38px; height:38px; background:var(--red); color:#F6F0E6; display:flex; align-items:center; justify-content:center;
         font-size:16px; font-weight:700; letter-spacing:0; line-height:1.05; text-align:center; flex:0 0 auto}
  .title{font-size:19px; font-weight:700; letter-spacing:5px}
  .tabs{display:flex; margin-left:10px; border:1px solid var(--ink)}
  .tab{border:0; border-right:1px solid var(--ink); background:transparent; color:var(--ink); font-family:var(--serif);
       font-size:15px; font-weight:700; letter-spacing:3px; padding:7px 20px; cursor:pointer}
  .tab:last-child{border-right:0}
  .tab.on{background:var(--ink); color:var(--paper)}
  .spacer{flex:1}
  .icon{border:1px solid var(--rule); background:transparent; color:var(--ink-soft); font-family:var(--serif);
        font-size:14px; letter-spacing:2px; padding:7px 13px; cursor:pointer}
  .icon:hover{border-color:var(--ink); color:var(--ink)}

  /* ---------- 時間 ---------- */
  main{flex:1; min-height:0; position:relative; display:flex; flex-direction:column;
       align-items:center; justify-content:center; padding:0 12px}
  .stage{display:flex; align-items:center; justify-content:center;
         padding:calc(var(--dh)*.06) calc(var(--dh)*.1); transition:background .3s}
  .grp{display:flex}
  .grp.hide{display:none}
  .colon.hide{display:none}   /* 沒有「時」就不要留下那個冒號 */
  .tile{
    width:calc(var(--dh)*.62); height:var(--dh); display:flex; align-items:center; justify-content:center;
    font-family:var(--numfont); font-size:calc(var(--dh)*1.02); font-weight:700; line-height:1;
    color:var(--num-color,var(--ink)); font-variant-numeric:lining-nums tabular-nums; transition:color .3s;
  }
  .colon{width:calc(var(--dh)*.26); height:var(--dh); display:flex; flex-direction:column; align-items:center;
         justify-content:center; gap:calc(var(--dh)*.16)}
  .colon i{width:calc(var(--dh)*.085); height:calc(var(--dh)*.085); background:var(--red); display:block; transition:background .3s}
  .colon.blink{animation:soft 1s steps(1,end) infinite}
  @keyframes soft{50%{opacity:.3}}
  .cs{align-self:flex-end; margin-bottom:calc(var(--dh)*.17); font-family:var(--numfont); font-size:calc(var(--dh)*.3);
      font-weight:700; color:var(--red); font-variant-numeric:lining-nums tabular-nums; min-width:calc(var(--dh)*.46)}
  #swView{--dh:min(clamp(126px,38vh,380px),19vw)}
  #swView .stage{padding-left:calc(var(--dh)*.46)}
  .underline{width:min(86vw,1100px); height:3px; background:var(--red)}
  .caption{margin-top:12px; text-align:center; font-size:clamp(13px,2vh,18px); letter-spacing:4px; color:var(--ink-soft)}

  /* 剩 1 分鐘：數字轉印章紅 ｜ 剩 30 秒：整塊閃動 ｜ 剩 10 秒：閃更快 */
  body.warn{--num-color:var(--red)}
  body.danger{--num-color:#F6F0E6}
  body.danger .stage{background:var(--red)}
  body.danger .colon i{background:#F6F0E6}
  body.danger .caption{color:var(--red)}
  /* 閃動：底色與字色同時換，三個動畫一起啟動所以會同步 */
  @keyframes flashBg {0%,49.9%{background:transparent}50%,100%{background:var(--red)}}
  @keyframes flashNum{0%,49.9%{color:var(--red)}     50%,100%{color:#F6F0E6}}
  @keyframes flashDot{0%,49.9%{background:var(--red)}50%,100%{background:#F6F0E6}}
  body.flash .stage  {animation:flashBg  2s steps(1,end) infinite}
  body.flash .tile   {animation:flashNum 2s steps(1,end) infinite}
  body.flash .colon i{animation:flashDot 2s steps(1,end) infinite}
  /* 最後 10 秒只稍微快一點點：看得出升溫，但不會刺眼 */
  body.flash.danger .stage,
  body.flash.danger .tile,
  body.flash.danger .colon i{animation-duration:1.5s}
  @media (prefers-reduced-motion:reduce){
    body.flash .stage, body.flash .tile, body.flash .colon i{animation:none}
  }

  /* ---------- 控制列 ---------- */
  .rows{flex:0 0 auto; position:relative; z-index:6; padding:0 12px 12px; display:flex; flex-direction:column;
        align-items:center; gap:8px}
  .row{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; align-items:center}
  .btns{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}
  .sep{width:1px; height:26px; background:var(--rule); margin:0 3px}
  button{font-family:var(--serif)}
  .qk{border:1px solid var(--ink); background:transparent; color:var(--ink); font-size:15px; font-weight:700;
      letter-spacing:2px; padding:7px 17px; cursor:pointer; transition:background .15s, color .15s}
  .qk:hover{background:var(--paper2)}
  .qk.on{background:var(--ink); color:var(--paper)}
  .qk.tiny{font-size:13px; padding:5px 12px; border-color:var(--rule); color:var(--ink-soft); letter-spacing:1px}
  .qk.tiny:hover{border-color:var(--ink); color:var(--ink)}
  .go-btn{background:var(--red); color:#F6F0E6; border:1px solid var(--red); font-size:20px; font-weight:700;
          letter-spacing:8px; padding:10px 46px 10px 54px; cursor:pointer}
  .go-btn:hover{background:var(--red-deep)}
  .go-btn.pause{background:transparent; color:var(--red)}
  .reset-btn{background:transparent; border:1px solid var(--rule); color:var(--ink-soft); font-size:15px; font-weight:700;
             letter-spacing:3px; padding:10px 20px; cursor:pointer}
  .reset-btn:hover{border-color:var(--ink); color:var(--ink)}
  .laps{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; max-height:6vh; overflow:auto}
  .lap{border:1px solid var(--rule); padding:3px 10px; font-size:13px; color:var(--ink-soft);
       font-variant-numeric:tabular-nums}
  .lap b{color:var(--red); margin-right:7px}
  .hint{font-size:12px; color:var(--ink-soft); letter-spacing:1px}

  /* ---------- 設定 ---------- */
  .sheet{position:fixed; top:62px; right:18px; width:272px; background:var(--paper); border:1px solid var(--ink);
         padding:16px; z-index:60; display:none}
  .sheet.on{display:block}
  .sheet h3{margin:0 0 12px; font-size:14px; letter-spacing:4px; color:var(--red);
            border-bottom:1px solid var(--rule); padding-bottom:7px}
  .fld{margin-bottom:13px}
  .fld label{display:block; font-size:13px; font-weight:700; letter-spacing:1px; margin-bottom:5px}
  .fld select,.fld input[type=range]{width:100%}
  .fld input[type=range]{accent-color:var(--red)}
  .fld select{padding:7px; background:var(--paper); color:var(--ink); border:1px solid var(--rule);
              font-family:var(--serif); font-size:14px}
  .chk{display:flex; align-items:center; gap:8px; font-size:14px; cursor:pointer}
  .chk input{width:16px; height:16px; accent-color:var(--red)}

  /* ---------- 時間到 ---------- */
  #over{position:fixed; inset:0; z-index:100; display:none; flex-direction:column; align-items:center; justify-content:center;
        background:var(--red); animation:alt 1.6s steps(1,end) infinite}
  @keyframes alt{50%{background:#2B2622}}
  #over.on{display:flex}
  #over .bar{width:min(70vw,760px); height:2px; background:#F6F0E6; opacity:.9}
  #over h1{margin:26px 0 18px; font-size:clamp(64px,15vw,260px); font-weight:700; color:#F6F0E6;
           letter-spacing:22px; text-indent:22px}
  #over .sub{color:#F6F0E6; opacity:.85; font-size:clamp(15px,2.6vh,24px); letter-spacing:6px; margin-bottom:34px}
  #over button{background:transparent; color:#F6F0E6; border:1px solid #F6F0E6; font-size:clamp(17px,3vh,28px);
               font-weight:700; letter-spacing:10px; padding:12px 40px 12px 50px; cursor:pointer; font-family:var(--serif)}
  #over button:hover{background:#F6F0E6; color:var(--red)}
  @media (max-width:640px){
    :root{--dh:min(clamp(88px,22vh,170px),21vw)}
    header{padding:9px 12px} .title{display:none} .sheet{left:10px; right:10px; width:auto}
  }
</style>
</head>
<body>

<header>
  <div class="stamp">計時</div>
  <div class="title">課堂計時器</div>
  <div class="tabs">
    <button class="tab on" data-mode="timer">倒數</button>
    <button class="tab" data-mode="sw">碼錶</button>
  </div>
  <div class="spacer"></div>
  <button class="icon" id="themeBtn">深色</button>
  <button class="icon" id="setBtn">設定</button>
  <button class="icon" id="fsBtn">全螢幕</button>
</header>

<main>
  <div id="timerView">
    <div class="stage">
      <div class="grp hide" id="tH"><div class="tile">0</div><div class="tile">0</div></div>
      <div class="colon hide" id="tC1"><i></i><i></i></div>
      <div class="grp" id="tM"><div class="tile">0</div><div class="tile">5</div></div>
      <div class="colon" id="tC2"><i></i><i></i></div>
      <div class="grp" id="tS"><div class="tile">0</div><div class="tile">0</div></div>
    </div>
    <div class="underline"></div>
    <div class="caption" id="cap">選定時間後，按「開始」</div>
  </div>

  <div id="swView" style="display:none">
    <div class="stage">
      <div class="grp hide" id="sH"><div class="tile">0</div><div class="tile">0</div></div>
      <div class="colon hide" id="sC1"><i></i><i></i></div>
      <div class="grp" id="sM"><div class="tile">0</div><div class="tile">0</div></div>
      <div class="colon" id="sC2"><i></i><i></i></div>
      <div class="grp" id="sS"><div class="tile">0</div><div class="tile">0</div></div>
      <div class="cs" id="sCS">.00</div>
    </div>
    <div class="underline"></div>
    <div class="caption">按「開始」計時，可分段記錄</div>
  </div>

</main>

<div class="rows">
  <div class="row" id="timeRow">
    <div class="btns" id="quickRow">
      <button class="qk" data-min="1">1 分</button>
      <button class="qk" data-min="5">5 分</button>
      <button class="qk" data-min="10">10 分</button>
      <button class="qk" data-min="20">20 分</button>
      <button class="qk" data-min="40">40 分</button>
    </div>
    <i class="sep"></i>
    <div class="btns" id="adjRow">
      <button class="qk tiny" data-add="-60">－1 分</button>
      <button class="qk tiny" data-add="-10">－10 秒</button>
      <button class="qk tiny" data-add="10">＋10 秒</button>
      <button class="qk tiny" data-add="60">＋1 分</button>
    </div>
  </div>
  <div class="row">
    <button class="go-btn" id="goBtn">開始</button>
    <button class="reset-btn" id="resetBtn">重設</button>
    <button class="reset-btn" id="lapBtn" style="display:none">分段</button>
  </div>
  <div class="laps" id="laps"></div>
  <div class="hint">空白鍵 = 開始／暫停　·　R = 重設　·　F = 全螢幕　·　1〜5 = 選時間</div>
</div>

<div class="sheet" id="sheet">
  <h3>設定</h3>
  <div class="fld">
    <label>時間到鈴聲</label>
    <select id="soundSel">
      <option value="alarm">急促鬧鈴（最響亮）</option>
      <option value="bell">下課鐘聲</option>
      <option value="melody">旋律提示</option>
    </select>
  </div>
  <div class="fld">
    <label>音量 <span id="volTxt">80%</span></label>
    <input type="range" id="vol" min="0" max="100" value="80">
  </div>
  <div class="fld"><label class="chk"><input type="checkbox" id="flashChk" checked> 最後 30 秒畫面閃動</label></div>
  <div class="fld"><label class="chk"><input type="checkbox" id="tickChk" checked> 最後 10 秒催促音效</label></div>
  <div class="fld" style="margin:0"><button class="qk tiny" id="testBtn" style="width:100%">試聽鈴聲（再點一次停止）</button></div>
</div>

<div id="over">
  <div class="bar"></div>
  <h1>時間到</h1>
  <div class="sub" id="overSub"></div>
  <button id="stopBtn">停止</button>
</div>

<script>
/* ===================== 聲音 ===================== */
let ac = null, master = null, alarmTimer = 0, alarmOn = false;
function audio(){
  if (!ac){
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain();
    master.gain.value = vol.value / 125;
    master.connect(ac.destination);
  }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(freq, at, dur, type, v){
  const c = audio(), o = c.createOscillator(), g = c.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, at);
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(v, at + 0.012);
  g.gain.setValueAtTime(v, at + dur*0.6);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g); g.connect(master);
  o.start(at); o.stop(at + dur + 0.02);
}
function schedulePattern(kind, t0){
  if (kind === 'alarm'){
    for (let i=0;i<8;i++){
      const t = t0 + i*0.14;
      tone(1046,t,0.10,'square',0.55); tone(1568,t,0.10,'square',0.30); tone(523,t,0.10,'sawtooth',0.22);
    }
    return 1.45;
  }
  if (kind === 'bell'){
    const ns = [784,659,523,659];
    for (let i=0;i<ns.length;i++){
      const t = t0 + i*0.62, f = ns[i];
      tone(f,t,1.35,'sine',0.60); tone(f*2,t,1.0,'sine',0.22); tone(f*3,t,0.55,'sine',0.10);
    }
    return 3.1;
  }
  const seq = [[523,.18],[659,.18],[784,.18],[1046,.36],[784,.18],[1046,.5]];
  let t = t0;
  for (let i=0;i<seq.length;i++){
    tone(seq[i][0], t, seq[i][1]*0.95, 'triangle', 0.55);
    tone(seq[i][0]*2, t, seq[i][1]*0.6, 'square', 0.16);
    t += seq[i][1];
  }
  return (t - t0) + 0.35;
}
function startAlarm(){
  if (alarmOn) return;
  alarmOn = true;
  const kind = soundSel.value;
  (function run(){
    if (!alarmOn) return;
    const len = schedulePattern(kind, audio().currentTime + 0.05);
    alarmTimer = setTimeout(run, len*1000);
  })();
}
function stopAlarm(){
  alarmOn = false; clearTimeout(alarmTimer);
  if (ac){
    master.gain.cancelScheduledValues(ac.currentTime);
    master.gain.setValueAtTime(0, ac.currentTime);
    setTimeout(function(){ if (master) master.gain.setValueAtTime(vol.value/125, ac.currentTime); }, 60);
  }
}
function urge(sec){                     /* 最後 10 秒的催促音，剩 3 秒起變成急促雙響 */
  const t = audio().currentTime + 0.01;
  if (sec > 3){ tone(932, t, 0.10, 'square', 0.38); return; }
  tone(1046, t,        0.09, 'square', 0.45);
  tone(1318, t + 0.13, 0.09, 'square', 0.45);
}
vol.oninput = function(){
  volTxt.textContent = vol.value + '%';
  if (master) master.gain.setValueAtTime(vol.value/125, ac.currentTime);
};
testBtn.onclick = function(){ alarmOn ? stopAlarm() : startAlarm(); };

/* ===================== 狀態 ===================== */
const st = {
  mode:'timer',
  t:{ total:300000, remain:300000, running:false, endAt:0, lastSec:-1 },
  s:{ running:false, base:0, elapsed:0, laps:[] }
};
const pad = n => String(n).padStart(2,'0');
function put(grp, txt){
  const k = grp.children;
  for (let i=0;i<k.length;i++) if (k[i].textContent !== txt[i]) k[i].textContent = txt[i];
}

/* 數字一律以寬度為準縮到剛好：量實際寬度再等比調整 --dh，出現「時」也不會被切掉 */
let fitSig = '';
function fitStage(hasH, force){
  const view  = st.mode === 'timer' ? timerView : swView;
  const stage = view.querySelector('.stage');
  const sig = st.mode + (hasH ? 'h' : '') + '|' + innerWidth + 'x' + innerHeight;
  if (!force && sig === fitSig) return;
  fitSig = sig;
  view.style.removeProperty('--dh');
  const avail = document.documentElement.clientWidth * 0.96;
  const w  = stage.getBoundingClientRect().width;
  const dh = stage.querySelector('.tile').getBoundingClientRect().height;
  if (!(w > 0) || !(dh > 0)){ fitSig = ''; return; }   /* 畫面還沒排好就先不要算 */
  if (w > avail) view.style.setProperty('--dh', (dh * avail / w) + 'px');
}
window.addEventListener('resize', function(){ fitStage(!tH.classList.contains('hide'), true); });

function showTimer(ms){
  if (ms < 0) ms = 0;
  const tot = Math.ceil(ms/1000);
  const h = Math.floor(tot/3600), m = Math.floor(tot%3600/60), s = tot%60;
  tH.classList.toggle('hide', h === 0); tC1.classList.toggle('hide', h === 0);
  if (h) put(tH, pad(Math.min(h,99)));
  put(tM, pad(m)); put(tS, pad(s));
  fitStage(h > 0);
  document.body.classList.toggle('danger', st.t.running && tot <= 10 && tot > 0);
  document.body.classList.toggle('warn',   st.t.running && tot <= 60 && tot > 10);
  document.body.classList.toggle('flash',  flashChk.checked && st.t.running && tot <= 30 && tot > 0);
  tC2.classList.toggle('blink', st.t.running);
  tC1.classList.toggle('blink', st.t.running);
}
function showSw(ms){
  const tot = Math.floor(ms/1000);
  const h = Math.floor(tot/3600), m = Math.floor(tot%3600/60), s = tot%60;
  sH.classList.toggle('hide', h === 0); sC1.classList.toggle('hide', h === 0);
  if (h) put(sH, pad(h));
  put(sM, pad(m)); put(sS, pad(s));
  sCS.textContent = '.' + pad(Math.floor(ms%1000/10));
  fitStage(h > 0);
}
function human(ms){
  const t = Math.round(ms/1000), m = Math.floor(t/60), s = t%60;
  if (!m) return s + ' 秒';
  return m + ' 分' + (s ? ' ' + s + ' 秒' : '');
}

/* ===================== 主迴圈 ===================== */
function step(){
  if (st.mode === 'timer' && st.t.running){
    const left = st.t.endAt - Date.now();
    st.t.remain = left > 0 ? left : 0;
    const sec = Math.ceil(st.t.remain/1000);
    if (sec !== st.t.lastSec){
      st.t.lastSec = sec;
      showTimer(st.t.remain);
      if (tickChk.checked && sec <= 10 && sec >= 1) urge(sec);
    }
    if (left <= 0) timeUp();
  } else if (st.mode === 'sw' && st.s.running){
    showSw(Date.now() - st.s.base);
  }
}
function loop(){ step(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
/* 視窗切到背景時 rAF 會被凍結，倒數會停住、時間到也不會響 —— 用 interval 當備援 */
setInterval(step, 250);

function timeUp(){
  st.t.running = false; st.t.remain = 0;
  showTimer(0);
  document.body.classList.remove('danger','warn','flash');
  goBtn.textContent = '開始'; goBtn.classList.remove('pause');
  cap.textContent = '再按「開始」可重跑同樣時間';
  overSub.textContent = human(st.t.total) + '　已結束';
  over.classList.add('on');
  startAlarm();
}
stopBtn.onclick = function(){ over.classList.remove('on'); stopAlarm(); };

/* ===================== 操作 ===================== */
function setTimer(ms){                       /* 只設定時間，不自動開始 */
  st.t.total = ms; st.t.remain = ms; st.t.lastSec = -1; st.t.running = false;
  document.body.classList.remove('danger','warn','flash');
  goBtn.textContent = '開始'; goBtn.classList.remove('pause');
  cap.textContent = ms > 0 ? '準備好了，按「開始」' : '請先選定時間';
  showTimer(ms);
}
function toggle(){
  audio();
  if (st.mode === 'timer'){
    if (st.t.running){
      st.t.running = false;
      st.t.remain = Math.max(0, st.t.endAt - Date.now());
      goBtn.textContent = '繼續'; goBtn.classList.remove('pause');
      cap.textContent = '暫停中';
      document.body.classList.remove('danger','warn','flash');
      showTimer(st.t.remain);
    } else {
      if (st.t.remain <= 0) st.t.remain = st.t.total;   /* 時間到後再按開始＝重跑 */
      if (st.t.remain <= 0){ cap.textContent = '請先選定時間'; return; }
      over.classList.remove('on'); stopAlarm();
      st.t.endAt = Date.now() + st.t.remain;
      st.t.running = true; st.t.lastSec = -1;
      goBtn.textContent = '暫停'; goBtn.classList.add('pause');
      cap.textContent = '計時中';
    }
  } else {
    if (st.s.running){
      st.s.running = false; st.s.elapsed = Date.now() - st.s.base;
      goBtn.textContent = '繼續'; goBtn.classList.remove('pause');
      showSw(st.s.elapsed);
    } else {
      st.s.base = Date.now() - st.s.elapsed; st.s.running = true;
      goBtn.textContent = '暫停'; goBtn.classList.add('pause');
    }
    sC2.classList.toggle('blink', st.s.running);
  }
}
function reset(){
  stopAlarm(); over.classList.remove('on');
  document.body.classList.remove('danger','warn','flash');
  goBtn.textContent = '開始'; goBtn.classList.remove('pause');
  if (st.mode === 'timer'){
    st.t.running = false; st.t.remain = st.t.total; st.t.lastSec = -1;
    cap.textContent = st.t.total > 0 ? '準備好了，按「開始」' : '請先選定時間';
    showTimer(st.t.total);
  } else {
    st.s.running = false; st.s.elapsed = 0; st.s.laps = []; laps.innerHTML = '';
    sC2.classList.remove('blink');
    showSw(0);
  }
}
goBtn.onclick = toggle;
resetBtn.onclick = reset;

document.querySelectorAll('#quickRow .qk').forEach(function(b){
  b.onclick = function(){
    audio(); stopAlarm(); over.classList.remove('on');
    if (st.mode !== 'timer') switchMode('timer');
    document.querySelectorAll('#quickRow .qk').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    setTimer(parseInt(b.dataset.min,10) * 60000);      /* 設定好，等老師按開始 */
  };
});
document.querySelectorAll('#adjRow .qk').forEach(function(b){
  b.onclick = function(){
    audio();
    const d = parseInt(b.dataset.add,10) * 1000;
    if (st.mode !== 'timer') switchMode('timer');
    if (st.t.running){
      st.t.endAt = Math.max(Date.now(), st.t.endAt + d);
      st.t.total = Math.max(0, st.t.total + d);
      st.t.lastSec = -1;
      showTimer(st.t.endAt - Date.now());
    } else {
      document.querySelectorAll('#quickRow .qk').forEach(function(x){ x.classList.remove('on'); });
      setTimer(Math.max(0, Math.min(st.t.remain + d, 359999000)));
    }
  };
});
lapBtn.onclick = function(){
  if (!st.s.running) return;
  const ms = Date.now() - st.s.base;
  st.s.laps.push(ms);
  const n = st.s.laps.length, prev = n > 1 ? st.s.laps[n-2] : 0;
  const f = function(x){
    const t = Math.floor(x/1000);
    return pad(Math.floor(t/60)) + ':' + pad(t%60) + '.' + pad(Math.floor(x%1000/10));
  };
  const el = document.createElement('div');
  el.className = 'lap';
  el.innerHTML = '<b>' + n + '</b>' + f(ms) + '　(+' + f(ms-prev) + ')';
  laps.insertBefore(el, laps.firstChild);
};

/* ===================== 模式切換 ===================== */
function switchMode(mode){
  st.mode = mode;
  stopAlarm(); over.classList.remove('on');
  document.body.classList.remove('danger','warn','flash');
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('on', t.dataset.mode === mode); });
  timerView.style.display = mode === 'timer' ? '' : 'none';
  swView.style.display    = mode === 'sw'    ? '' : 'none';
  timeRow.style.display   = mode === 'timer' ? '' : 'none';
  lapBtn.style.display    = mode === 'sw'    ? '' : 'none';
  laps.style.display      = mode === 'sw'    ? '' : 'none';
  const run = mode === 'timer' ? st.t.running : st.s.running;
  goBtn.textContent = run ? '暫停' : '開始';
  goBtn.classList.toggle('pause', run);
  fitSig = '';
  if (mode === 'timer') showTimer(st.t.running ? st.t.endAt - Date.now() : st.t.remain);
  else showSw(st.s.running ? Date.now() - st.s.base : st.s.elapsed);
}
document.querySelectorAll('.tab').forEach(function(t){ t.onclick = function(){ switchMode(t.dataset.mode); }; });

/* ===================== 介面雜項 ===================== */
setBtn.onclick = function(e){ e.stopPropagation(); sheet.classList.toggle('on'); };
document.addEventListener('click', function(e){
  if (!sheet.contains(e.target) && e.target !== setBtn) sheet.classList.remove('on');
});
fsBtn.onclick = function(){
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(function(){});
};
themeBtn.onclick = function(){
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? '' : 'dark');
  themeBtn.textContent = dark ? '深色' : '紙色';
  try{ localStorage.setItem('ct-theme', dark ? '' : 'dark'); }catch(e){}
};
try{
  const th = localStorage.getItem('ct-theme');
  if (th){ document.documentElement.setAttribute('data-theme', th); themeBtn.textContent = '紙色'; }
}catch(e){}

document.addEventListener('keydown', function(e){
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const k = e.key.toLowerCase();
  if (e.code === 'Space'){ e.preventDefault(); if (alarmOn){ stopAlarm(); over.classList.remove('on'); } else toggle(); }
  else if (k === 'r') reset();
  else if (k === 'f') fsBtn.onclick();
  else if (k === 'l') lapBtn.onclick();
  else if ('12345'.indexOf(k) >= 0) document.querySelectorAll('#quickRow .qk')[parseInt(k,10)-1].click();
});

let wl = null;
async function keepAwake(){
  try{ if ('wakeLock' in navigator) wl = await navigator.wakeLock.request('screen'); }catch(e){}
}
document.addEventListener('click', function once(){ keepAwake(); document.removeEventListener('click', once); });
document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') keepAwake(); });

showTimer(st.t.total);
showSw(0);
document.querySelector('#quickRow .qk[data-min="5"]').classList.add('on');
</script>
</body>
